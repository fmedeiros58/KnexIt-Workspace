# Publicacao segura da API Knexspace (Nginx)
# Objetivo:
# - Expor somente 80/443 ao publico
# - Encaminhar trafego HTTPS para backend interno em 127.0.0.1:3000
# - Manter vLLM (127.0.0.1:8000) e bancos (localhost) privados

server {
  listen 80;
  listen [::]:80;
  server_name api.knexspace.com knexspace.com;

  # Redireciona todo HTTP para HTTPS.
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.knexspace.com knexspace.com;

  # Ajuste estes paths conforme o certificado emitido.
  ssl_certificate /etc/letsencrypt/live/api.knexspace.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.knexspace.com/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ANM exposto de forma controlada por path dedicado.
  # Exemplo de uso em Vercel:
  # ANM_API_BASE_URL=https://api.knexspace.com/anm
  location = /anm {
    return 308 /anm/;
  }

  location /anm/ {
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8100/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location / {
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Suporte a conexoes longas/streaming.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
