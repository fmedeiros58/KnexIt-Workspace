apiVersion: v1
kind: ConfigMap
metadata:
  name: knexit-runtime-config
  namespace: knexit
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  KNEXAI_ENGINE_MODE: "direct"
  KNEXAI_DESCENDING_ALLOW_DIRECT_FALLBACK: "1"
  KNEXAI_LLM_HOST_ONLY: "0"
  RAG_LLM_HOST_ONLY: "0"
  RAG_REQUIRE_INTERNAL_LLM_URL: "0"
  AI_SYSTEM_ANM_API_BASE_URL: "http://knexit-web:3000"
  AI_SYSTEM_ANM_API_BASE_URL_FALLBACKS: ""
  AI_SYSTEM_ANM_K8S_API_BASE_URL: "http://knexit-web:3000"
  AI_SYSTEM_ANM_WSL_DISCOVERY_ENABLED: "false"
  AI_SYSTEM_ANM_BASE_URL_STICKY_REACHABLE_MS: "120000"
  AI_SYSTEM_ANM_BASE_URL_RESOLUTION_CACHE_MS: "3000"
  AI_SYSTEM_ANM_VLLM_URL: "http://vllm:8000/v1"
  RAG_LLM_BASE_URL: "http://vllm:8000/v1"
  LOCAL_LLM_BASE_URL: "http://vllm:8000/v1"
  VLLM_BASE_URL: "http://vllm:8000/v1"
  AI_SYSTEM_ANM_ENGINE_BASE_URL: "http://vllm:8000/v1"
  AI_SYSTEM_ANM_ENGINE_K8S_SERVICE_NAME: "vllm"
  AI_SYSTEM_ANM_ENGINE_WSL_DISCOVERY_ENABLED: "false"
  AI_SYSTEM_ANM_MODEL_NAME: "mistral-awq"
  VLLM_MODEL: "/models/CModelosMistral-7B-Instruct-v0.2-AWQ"
  VLLM_MAX_MODEL_LEN: "4096"
  LLM_TIMEOUT_MS: "45000"
  EMBEDDING_BASE_URL: "http://host.docker.internal:8001/v1"
  EMBEDDING_MODEL_NAME: "intfloat/multilingual-e5-base"
  EMBEDDING_BASE_URL_FALLBACKS: ""
  EMBEDDING_HEALTHCHECK_PATH: "/health"


