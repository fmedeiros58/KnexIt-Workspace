apiVersion: v1
kind: ConfigMap
metadata:
  name: knexit-runtime-config
  namespace: knexit
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  ANM_BACKEND_BASE_URL: "http://anm-backend:8100"
  ANM_BACKEND_BASE_URL_FALLBACKS: "http://anm-backend:8100"
  ANM_K8S_SERVICE_BASE_URL: "http://anm-backend:8100"
  ANM_WSL_DISCOVERY_ENABLED: "false"
  ANM_BASE_URL_STICKY_REACHABLE_MS: "120000"
  ANM_BASE_URL_RESOLUTION_CACHE_MS: "3000"
  ANM_VLLM_URL: "http://vllm:8000/v1"
  LOCAL_LLM_BASE_URL: "http://vllm:8000/v1"
  VLLM_BASE_URL: "http://vllm:8000/v1"
  ANM_ENGINE_BASE_URL: "http://vllm:8000/v1"
  ANM_ENGINE_K8S_SERVICE_NAME: "vllm"
  ANM_ENGINE_WSL_DISCOVERY_ENABLED: "false"
  ANM_MODEL_NAME: "mistral-awq"
  VLLM_MODEL: "mistralai/Mistral-7B-Instruct-v0.2"
  VLLM_MAX_MODEL_LEN: "4096"
  LLM_TIMEOUT_MS: "45000"
